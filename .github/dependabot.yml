version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  ignore:
    # Every major pagy release has historically been a ground-up API rewrite
    # (43.x removed Pagy::Backend/Frontend and the extras system, see
    # CLAUDE.md's Tech Stack note) — not a compatible upgrade. Revisit future
    # majors only as a deliberate, tested migration.
    - dependency-name: pagy
      update-types: ["version-update:semver-major"]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
