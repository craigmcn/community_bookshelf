version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  ignore:
    # Every major pagy release has historically been a ground-up API rewrite
    # (43.x removed Pagy::Backend/Frontend and the extras system, see
    # CLAUDE.md's Tech Stack note) — not a compatible upgrade. Revisit future
    # majors only as a deliberate, tested migration.
    - dependency-name: pagy
      update-types: ["version-update:semver-major"]
  groups:
    security:
      applies-to: security-updates
      patterns: ["*"]
    # One PR for all minor/patch bumps; majors stay separate so a breaking
    # upgrade can be reviewed (or ignored) on its own.
    minor-and-patch:
      update-types: [minor, patch]
      patterns: ["*"]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    actions:
      patterns: ["*"]
# Security updates only: limit 0 turns version updates off, and the group
# bundles concurrent advisories into one PR so CI runs once.
- package-ecosystem: npm
  directories:
    - "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 0
  groups:
    security:
      applies-to: security-updates
      patterns: ["*"]
