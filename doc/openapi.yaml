openapi: 3.0.3
info:
  title: Community Bookshelf API
  version: "1"
  description: |
    A JSON API for the book catalog and reading logs. See doc/api-guide.md
    in the repository for the full prose guide (getting a token, rate
    limits, error shapes) — this spec covers the same endpoints in a
    machine-readable form for client codegen and interactive exploration.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Books
  - name: Readings
  - name: Shelves
  - name: Follows
  - name: ReadingChallenges
  - name: Stats
  - name: Clubs
  - name: BuddyReads
  - name: Notifications

paths:
  /books:
    get:
      tags: [Books]
      summary: List books
      parameters:
        - name: q
          in: query
          description: Search by title or author (ILIKE match)
          schema: {type: string}
        - name: page
          in: query
          schema: {type: integer, default: 1}
      responses:
        "200":
          description: Paginated list of books
          content:
            application/json:
              schema:
                type: object
                properties:
                  books:
                    type: array
                    items: {$ref: "#/components/schemas/Book"}
                  pagination: {$ref: "#/components/schemas/Pagination"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [Books]
      summary: Create a book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [book]
              properties:
                book: {$ref: "#/components/schemas/BookInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Book"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /books/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer}
    get:
      tags: [Books]
      summary: Show a book
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Book"}
        "304": {description: Not Modified (ETag matched If-None-Match)}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [Books]
      summary: Update a book (moderator or admin only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [book]
              properties:
                book: {$ref: "#/components/schemas/BookInput"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Book"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    delete:
      tags: [Books]
      summary: Delete a book (moderator or admin only)
      responses:
        "204": {description: No Content}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /readings:
    get:
      tags: [Readings]
      summary: List readings (your own; moderators/admins see everyone's)
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [want_to_read, reading, finished]}
        - name: page
          in: query
          schema: {type: integer, default: 1}
      responses:
        "200":
          description: Paginated list of readings
          content:
            application/json:
              schema:
                type: object
                properties:
                  readings:
                    type: array
                    items: {$ref: "#/components/schemas/Reading"}
                  pagination: {$ref: "#/components/schemas/Pagination"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [Readings]
      summary: Create a reading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reading]
              properties:
                reading: {$ref: "#/components/schemas/ReadingInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReadingWithBook"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /readings/bulk:
    post:
      tags: [Readings]
      summary: Create up to 100 readings in one request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                readings:
                  type: array
                  maxItems: 100
                  items: {$ref: "#/components/schemas/ReadingInput"}
      responses:
        "200":
          description: Always 200 — check each row's own status
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        index: {type: integer}
                        status: {type: string, enum: [created, error]}
                        reading: {$ref: "#/components/schemas/Reading"}
                        errors: {type: array, items: {type: string}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /readings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer}
    get:
      tags: [Readings]
      summary: Show a reading (owner, moderator/admin, or anyone if the review is public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReadingWithBook"}
        "304": {description: Not Modified (ETag matched If-None-Match)}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [Readings]
      summary: Update a reading (owner, or moderator/admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reading]
              properties:
                reading: {$ref: "#/components/schemas/ReadingInput"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReadingWithBook"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    delete:
      tags: [Readings]
      summary: Soft-delete a reading (moderator or admin only)
      responses:
        "204": {description: No Content}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /shelves:
    get:
      tags: [Shelves]
      summary: List your own shelves
      parameters:
        - name: page
          in: query
          schema: {type: integer, default: 1}
      responses:
        "200":
          description: Paginated list of shelves
          content:
            application/json:
              schema:
                type: object
                properties:
                  shelves:
                    type: array
                    items: {$ref: "#/components/schemas/Shelf"}
                  pagination: {$ref: "#/components/schemas/Pagination"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [Shelves]
      summary: Create a shelf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shelf]
              properties:
                shelf: {$ref: "#/components/schemas/ShelfInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShelfWithBooks"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /shelves/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer}
    get:
      tags: [Shelves]
      summary: Show a shelf and its books (owner only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShelfWithBooks"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [Shelves]
      summary: Rename a shelf (owner only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [shelf]
              properties:
                shelf: {$ref: "#/components/schemas/ShelfInput"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShelfWithBooks"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    delete:
      tags: [Shelves]
      summary: Delete a shelf (owner only)
      responses:
        "204": {description: No Content}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /shelves/{shelf_id}/books:
    parameters:
      - name: shelf_id
        in: path
        required: true
        schema: {type: integer}
    post:
      tags: [Shelves]
      summary: Add a book to a shelf (owner only, idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [book_id]
              properties:
                book_id: {type: integer}
      responses:
        "201":
          description: Created (or already present — adding is idempotent)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShelfWithBooks"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /shelves/{shelf_id}/books/{id}:
    parameters:
      - name: shelf_id
        in: path
        required: true
        schema: {type: integer}
      - name: id
        in: path
        required: true
        description: The shelf/book pairing's id (not the book's own id)
        schema: {type: integer}
    delete:
      tags: [Shelves]
      summary: Remove a book from a shelf (owner only)
      responses:
        "204": {description: No Content}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /users/{user_id}/follow:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: {type: integer}
    post:
      tags: [Follows]
      summary: Follow a user (can't follow yourself)
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Follow"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    delete:
      tags: [Follows]
      summary: Unfollow a user (idempotent — 204 even if not currently following)
      responses:
        "204": {description: No Content}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /reading_challenges:
    get:
      tags: [ReadingChallenges]
      summary: List your own reading challenges
      responses:
        "200":
          description: List of reading challenges
          content:
            application/json:
              schema:
                type: object
                properties:
                  reading_challenges:
                    type: array
                    items: {$ref: "#/components/schemas/ReadingChallenge"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [ReadingChallenges]
      summary: Create a reading challenge (one per calendar year)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reading_challenge]
              properties:
                reading_challenge: {$ref: "#/components/schemas/ReadingChallengeInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReadingChallenge"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /reading_challenges/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer}
    patch:
      tags: [ReadingChallenges]
      summary: Update a reading challenge's goal (owner only — year is immutable)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reading_challenge]
              properties:
                reading_challenge:
                  type: object
                  properties:
                    goal: {type: integer}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReadingChallenge"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /stats:
    get:
      tags: [Stats]
      summary: Your personal reading stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Stats"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /clubs:
    get:
      tags: [Clubs]
      summary: List all clubs
      responses:
        "200":
          description: List of clubs
          content:
            application/json:
              schema:
                type: object
                properties:
                  clubs:
                    type: array
                    items: {$ref: "#/components/schemas/Club"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [Clubs]
      summary: Create a club (auto-joins you as a member)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [club]
              properties:
                club: {$ref: "#/components/schemas/ClubInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClubWithPosts"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /clubs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer}
    get:
      tags: [Clubs]
      summary: Show a club and its posts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClubWithPosts"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [Clubs]
      summary: Update a club (creator, or moderator/admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [club]
              properties:
                club: {$ref: "#/components/schemas/ClubInput"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClubWithPosts"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    delete:
      tags: [Clubs]
      summary: Delete a club (creator, or moderator/admin)
      responses:
        "204": {description: No Content}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /clubs/{club_id}/membership:
    parameters:
      - name: club_id
        in: path
        required: true
        schema: {type: integer}
    post:
      tags: [Clubs]
      summary: Join a club
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClubWithPosts"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Clubs]
      summary: Leave a club (idempotent — 204 even if not a member)
      responses:
        "204": {description: No Content}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /clubs/{club_id}/posts:
    parameters:
      - name: club_id
        in: path
        required: true
        schema: {type: integer}
    post:
      tags: [Clubs]
      summary: Post to a club (members only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [club_post]
              properties:
                club_post: {$ref: "#/components/schemas/ClubPostInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClubPost"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /clubs/{club_id}/posts/{id}:
    parameters:
      - name: club_id
        in: path
        required: true
        schema: {type: integer}
      - name: id
        in: path
        required: true
        schema: {type: integer}
    delete:
      tags: [Clubs]
      summary: Delete a club post (author, or moderator/admin)
      responses:
        "204": {description: No Content}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /buddy_reads:
    get:
      tags: [BuddyReads]
      summary: List your own buddy reads (as initiator or partner)
      responses:
        "200":
          description: List of buddy reads
          content:
            application/json:
              schema:
                type: object
                properties:
                  buddy_reads:
                    type: array
                    items: {$ref: "#/components/schemas/BuddyRead"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [BuddyReads]
      summary: Invite another member to a buddy read (can't invite yourself)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buddy_read]
              properties:
                buddy_read: {$ref: "#/components/schemas/BuddyReadInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BuddyReadWithMessages"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /buddy_reads/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer}
    get:
      tags: [BuddyReads]
      summary: Show a buddy read and its messages (either participant only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BuddyReadWithMessages"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [BuddyReads]
      summary: Drive the status state machine (accept/decline/cancel/complete)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [accepted, declined, cancelled, completed]}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BuddyReadWithMessages"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422":
          description: Invalid transition (e.g. the initiator trying to accept their own invite) or unrecognized status
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorMessages"}

  /buddy_reads/{buddy_read_id}/messages:
    parameters:
      - name: buddy_read_id
        in: path
        required: true
        schema: {type: integer}
    post:
      tags: [BuddyReads]
      summary: Post a message (either participant, while the pairing is still active)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buddy_read_message]
              properties:
                buddy_read_message: {$ref: "#/components/schemas/BuddyReadMessageInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BuddyReadMessage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /notifications:
    get:
      tags: [Notifications]
      summary: List your own notifications
      parameters:
        - name: page
          in: query
          schema: {type: integer, default: 1}
      responses:
        "200":
          description: Paginated list of notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items: {$ref: "#/components/schemas/Notification"}
                  pagination: {$ref: "#/components/schemas/Pagination"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /notifications/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer}
    patch:
      tags: [Notifications]
      summary: Mark a notification read (recipient only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Notification"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /notifications/mark_all_read:
    patch:
      tags: [Notifications]
      summary: Mark every unread notification read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  marked_read: {type: integer, description: How many notifications were just marked read}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A scoped, optionally-expiring personal access token, created from
        /api_tokens. Every endpoint requires one with the relevant scope
        (read:books, write:books, read:readings, write:readings,
        read:shelves, write:shelves, write:follows, read:reading_challenges,
        write:reading_challenges, read:stats, read:clubs, write:clubs,
        read:buddy_reads, write:buddy_reads, read:notifications,
        write:notifications) — there is no anonymous access, even for
        catalog browsing that's public on the website.

  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorMessage"}
    Forbidden:
      description: Token is valid, but you're not allowed to do this
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorMessage"}
    NotFound:
      description: Resource doesn't exist
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorMessage"}
    ValidationFailed:
      description: Validation failed on create/update
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorMessages"}

  schemas:
    ErrorMessage:
      type: object
      properties:
        error: {type: string}
    ErrorMessages:
      type: object
      properties:
        errors: {type: array, items: {type: string}}
    Pagination:
      type: object
      properties:
        page: {type: integer}
        pages: {type: integer}
        count: {type: integer}
    Book:
      type: object
      properties:
        id: {type: integer}
        title: {type: string}
        author: {type: string}
        isbn: {type: string, nullable: true}
        cover_url: {type: string, nullable: true}
        page_count: {type: integer, nullable: true}
        published_on: {type: string, format: date, nullable: true}
        description: {type: string, nullable: true}
        subjects: {type: array, items: {type: string}}
        series_id: {type: integer, nullable: true}
        series_position: {type: integer, nullable: true}
        added_by_id: {type: integer}
        tag_list: {type: string}
        mood_list: {type: string}
        pace_list: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    BookInput:
      type: object
      required: [title, author]
      properties:
        title: {type: string}
        author: {type: string}
        cover_url: {type: string}
        isbn: {type: string}
        page_count: {type: integer}
        published_on: {type: string, format: date}
        open_library_key:
          type: string
          description: Auto-fills description/subjects from Open Library
        series_id: {type: integer}
        series_position: {type: integer}
        tag_list: {type: string, description: Comma-separated}
        mood_list: {type: string, description: Comma-separated}
        pace_list: {type: string, description: Comma-separated}
    Reading:
      type: object
      properties:
        id: {type: integer}
        book_id: {type: integer}
        user_id: {type: integer}
        status: {type: string, enum: [want_to_read, reading, finished]}
        rating: {type: string, enum: [one, two, three, four, five], nullable: true}
        review: {type: string, nullable: true}
        is_review_public: {type: boolean}
        started_on: {type: string, format: date, nullable: true}
        finished_on: {type: string, format: date, nullable: true}
        progress_percent: {type: integer, nullable: true}
        format: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ReadingWithBook:
      allOf:
        - $ref: "#/components/schemas/Reading"
        - type: object
          properties:
            book: {$ref: "#/components/schemas/Book"}
    ReadingInput:
      type: object
      required: [book_id, status]
      properties:
        book_id: {type: integer}
        status: {type: string, enum: [want_to_read, reading, finished]}
        rating: {type: string, enum: [one, two, three, four, five]}
        review: {type: string}
        is_review_public: {type: boolean}
        started_on: {type: string, format: date}
        finished_on: {type: string, format: date}
        progress_percent: {type: integer}
        format: {type: string}
    Shelf:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        user_id: {type: integer}
        book_count: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ShelfWithBooks:
      allOf:
        - $ref: "#/components/schemas/Shelf"
        - type: object
          properties:
            books:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/BookSummary"
                  - type: object
                    properties:
                      shelf_book_id:
                        type: integer
                        description: The shelf/book pairing's id — pass as :id to DELETE /shelves/{shelf_id}/books/{id}
    BookSummary:
      description: |
        A book as nested inside a shelf response — the same fields as Book
        minus tag_list/mood_list/pace_list (each of those runs its own
        query, and a shelf's book list isn't paginated, so they're omitted
        here to avoid a large per-book query fan-out). Fetch
        GET /books/{id} if you need those.
      type: object
      properties:
        id: {type: integer}
        title: {type: string}
        author: {type: string}
        isbn: {type: string, nullable: true}
        cover_url: {type: string, nullable: true}
        page_count: {type: integer, nullable: true}
        published_on: {type: string, format: date, nullable: true}
        description: {type: string, nullable: true}
        subjects: {type: array, items: {type: string}}
        series_id: {type: integer, nullable: true}
        series_position: {type: integer, nullable: true}
        added_by_id: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ShelfInput:
      type: object
      required: [name]
      properties:
        name: {type: string}
    Follow:
      type: object
      properties:
        id: {type: integer}
        follower_id: {type: integer}
        followed_id: {type: integer}
        created_at: {type: string, format: date-time}
    ReadingChallenge:
      type: object
      properties:
        id: {type: integer}
        user_id: {type: integer}
        year: {type: integer}
        goal: {type: integer}
        books_finished_count: {type: integer}
        progress_percent: {type: integer, description: Capped at 100}
        completed: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ReadingChallengeInput:
      type: object
      required: [year, goal]
      properties:
        year: {type: integer, minimum: 2000, maximum: 2200}
        goal: {type: integer, minimum: 1}
    Stats:
      type: object
      properties:
        genre_breakdown:
          type: array
          description: One entry per genre tag across your finished books
          items:
            type: object
            properties:
              genre: {type: string}
              count: {type: integer}
        books_finished_by_month:
          type: array
          description: Always 12 entries — the trailing 12 calendar months, zero-filled
          items:
            type: object
            properties:
              month: {type: string, format: date}
              count: {type: integer}
        pages_read_by_month:
          type: array
          description: Always 12 entries — the trailing 12 calendar months, zero-filled
          items:
            type: object
            properties:
              month: {type: string, format: date}
              pages: {type: integer}
    Club:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: string, nullable: true}
        book_id: {type: integer}
        created_by_id: {type: integer}
        member_count: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ClubWithPosts:
      allOf:
        - $ref: "#/components/schemas/Club"
        - type: object
          properties:
            club_posts:
              type: array
              items: {$ref: "#/components/schemas/ClubPost"}
    ClubInput:
      type: object
      required: [name, book_id]
      properties:
        name: {type: string, maxLength: 100}
        description: {type: string, maxLength: 1000}
        book_id: {type: integer}
    ClubPost:
      type: object
      description: |
        A post flagged spoiler is hidden from a member until they have a
        finished Reading for the club's book (its own author and
        moderators/admins always see it) — body is null and hidden is true
        when withheld from the current viewer.
      properties:
        id: {type: integer}
        club_id: {type: integer}
        user_id: {type: integer}
        spoiler: {type: boolean}
        hidden: {type: boolean}
        body: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
    ClubPostInput:
      type: object
      required: [body]
      properties:
        body: {type: string, maxLength: 2000}
        spoiler: {type: boolean, default: false}
    BuddyReadParticipant:
      type: object
      properties:
        id: {type: integer}
        display_name: {type: string}
    BuddyRead:
      type: object
      properties:
        id: {type: integer}
        book_id: {type: integer}
        initiator_id: {type: integer}
        partner_id: {type: integer}
        status: {type: string, enum: [pending, accepted, declined, cancelled, completed]}
        book:
          type: object
          properties:
            id: {type: integer}
            title: {type: string}
        initiator: {$ref: "#/components/schemas/BuddyReadParticipant"}
        partner: {$ref: "#/components/schemas/BuddyReadParticipant"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    BuddyReadWithMessages:
      allOf:
        - $ref: "#/components/schemas/BuddyRead"
        - type: object
          properties:
            messages:
              type: array
              items: {$ref: "#/components/schemas/BuddyReadMessage"}
    BuddyReadInput:
      type: object
      required: [book_id, partner_id]
      properties:
        book_id: {type: integer}
        partner_id: {type: integer}
    BuddyReadMessage:
      type: object
      properties:
        id: {type: integer}
        buddy_read_id: {type: integer}
        user_id: {type: integer}
        user: {$ref: "#/components/schemas/BuddyReadParticipant"}
        body: {type: string}
        created_at: {type: string, format: date-time}
    BuddyReadMessageInput:
      type: object
      required: [body]
      properties:
        body: {type: string, maxLength: 1000}
    Notification:
      type: object
      description: |
        target_type/target_id let a client build its own follow-up
        request, since a JSON response can't carry a Rails path the way
        the website's notification links do.
      properties:
        id: {type: integer}
        notification_type: {type: string, enum: [new_follower, review_comment, club_post]}
        message: {type: string}
        read_at: {type: string, format: date-time, nullable: true}
        actor:
          type: object
          properties:
            id: {type: integer}
            display_name: {type: string}
        target_type: {type: string, enum: [user, reading, club]}
        target_id: {type: integer}
        created_at: {type: string, format: date-time}
