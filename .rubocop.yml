require:
  - standard

plugins:
  - standard-rails

inherit_gem:
  standard: config/base.yml
  standard-rails: config/base.yml

inherit_mode:
  merge:
    - Exclude

AllCops:
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "db/migrate/**/*"

# db:seed is an interactive console script — puts is the right tool for
# progress output here, not Rails.logger (which may not print to the console).
Rails/Output:
  Exclude:
    - "db/seeds.rb"
